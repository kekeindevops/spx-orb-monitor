name: SPX ORB Monitor + Watchlist

on:
  schedule:
    - cron: '25 13 * * 1-5'
  workflow_dispatch:

jobs:
  orb-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Run SPX ORB Monitor
        run: |
          #!/bin/bash
          set +e

          NTFY_TOPIC="https://ntfy.sh/spx-orb-alerts-balg-2026"

          send_alert() {
            local title="$1"
            local priority="$2"
            local tags="$3"
            local message="$4"
            curl -s -X POST "$NTFY_TOPIC" \
              -H "Title: $title" \
              -H "Priority: $priority" \
              -H "Tags: $tags" \
              -H "Content-Type: text/plain" \
              --data-raw "$message"
            echo "Alert sent: $title"
          }

          get_spx() {
            local result
            result=$(curl -s -L -A "Mozilla/5.0" \
              "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=1m&range=1d" | \
              python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    meta = data['chart']['result'][0]['meta']
    print(meta['regularMarketPrice'])
except Exception as e:
    print('0')
" 2>/dev/null)
            echo "${result:-0}"
          }

          get_spx_prev_close() {
            local result
            result=$(curl -s -L -A "Mozilla/5.0" \
              "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=1m&range=1d" | \
              python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    meta = data['chart']['result'][0]['meta']
    print(meta['previousClose'])
except Exception as e:
    print('0')
" 2>/dev/null)
            echo "${result:-0}"
          }

          get_spx_5min_last_candle() {
            local result
            result=$(curl -s -L -A "Mozilla/5.0" \
              "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=5m&range=1d" | \
              python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    closes = data['chart']['result'][0]['indicators']['quote'][0]['close']
    closes = [c for c in closes if c is not None]
    print(closes[-2] if len(closes) >= 2 else closes[-1])
except Exception as e:
    print('0')
" 2>/dev/null)
            echo "${result:-0}"
          }

          get_stock_price() {
            local symbol="$1"
            local result
            result=$(curl -s -L -A "Mozilla/5.0" \
              "https://query1.finance.yahoo.com/v8/finance/chart/$symbol?interval=1m&range=1d" | \
              python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    meta = data['chart']['result'][0]['meta']
    price = meta.get('regularMarketPrice', 0)
    prev = meta.get('previousClose', price)
    chg = ((price - prev) / prev * 100) if prev else 0
    print(f'\${price:.2f} ({chg:+.2f}%)')
except Exception as e:
    print('N/A')
" 2>/dev/null)
            echo "${result:-N/A}"
          }

          get_watchlist() {
            local nvda=$(get_stock_price "NVDA")
            local sndk=$(get_stock_price "SNDK")
            local lite=$(get_stock_price "LITE")
            local gev=$(get_stock_price "GEV")
            local mstr=$(get_stock_price "MSTR")
            local usar=$(get_stock_price "USAR")
            echo "NVDA: $nvda | SNDK: $sndk | LITE: $lite | GEV: $gev | MSTR: $mstr | USAR: $usar"
          }

          # ── PHASE 1: PRE-MARKET 9:25 AM ──────────────────────────
          echo "=== PHASE 1: PRE-MARKET ==="
          SPX=$(get_spx)
          PREV=$(get_spx_prev_close)
          SPY=$(echo "scale=2; $SPX / 10" | bc)

          if (( $(echo "$SPX > $PREV" | bc -l) )); then BIAS="BULLISH"
          elif (( $(echo "$SPX < $PREV" | bc -l) )); then BIAS="BEARISH"
          else BIAS="NEUTRAL"; fi

          WATCHLIST=$(get_watchlist)

          send_alert "SPX Pre-Market Bias" "default" "chart_with_upwards_trend" \
            "SPX: $SPX | SPY: \$$SPY | Bias: $BIAS | Prev Close: $PREV | ORB levels at 9:45 AM | Before 11AM=0DTE After 11AM=1DTE | $WATCHLIST"

          # ── PHASE 2: ORB BUILDING 9:30–9:45 AM ──────────────────
          echo "=== PHASE 2: SLEEPING 5 MIN FOR MARKET OPEN ==="
          sleep 300

          ORB_HIGH=0
          ORB_LOW=999999
          END_ORB=$(($(date +%s) + 900))

          send_alert "ORB Building" "default" "eyes" \
            "Market open! Tracking SPX high and low for 15 minutes. NO entries until 9:45 AM."

          while [ $(date +%s) -lt $END_ORB ]; do
            PRICE=$(get_spx)
            if [ "$PRICE" != "0" ]; then
              if (( $(echo "$PRICE > $ORB_HIGH" | bc -l) )); then ORB_HIGH=$PRICE; fi
              if (( $(echo "$PRICE < $ORB_LOW" | bc -l) )); then ORB_LOW=$PRICE; fi
            fi
            echo "SPX: $PRICE | High: $ORB_HIGH | Low: $ORB_LOW"
            sleep 60
          done

          # ── PHASE 3: ORB ANNOUNCEMENT 9:45 AM ────────────────────
          echo "=== PHASE 3: ORB ANNOUNCEMENT ==="
          ORB_RANGE=$(echo "scale=2; $ORB_HIGH - $ORB_LOW" | bc)

          if (( $(echo "$ORB_RANGE < 15" | bc -l) )); then
            DAY_TYPE="CHOPPY"
            T1_OFFSET="1.00"
            T2_OFFSET="1.50"
          else
            DAY_TYPE="TRENDING"
            T1_OFFSET="1.50"
            T2_OFFSET="2.00"
          fi

          send_alert "ORB SET - $DAY_TYPE DAY" "high" "chart_with_upwards_trend" \
            "ORB High: $ORB_HIGH | ORB Low: $ORB_LOW | Range: $ORB_RANGE pts | $DAY_TYPE | BULL entry: 5-min candle CLOSES above $ORB_HIGH | BEAR entry: 5-min candle CLOSES below $ORB_LOW | T1: +\$$T1_OFFSET sell 25 | T2: +\$$T2_OFFSET sell 25 | SPY 0.10 delta 50 contracts"

          # ── PHASE 4: MONITORING 9:45 AM – 2:00 PM ────────────────
          echo "=== PHASE 4: MONITORING ==="
          IN_TRADE=false
          DIRECTION=""
          SPY_ENTRY=0
          T1=0
          T2=0
          T1_HIT=false
          T2_HIT=false
          LAST_HOURLY=$(date +%s)
          END_SESSION=$(($(date +%s) + 15300))

          while [ $(date +%s) -lt $END_SESSION ]; do
            PRICE=$(get_spx)
            SPY_PRICE=$(echo "scale=2; $PRICE / 10" | bc)
            NOW=$(date +%s)
            UTC_HOUR=$(date -u +%H)
            EXPIRY="0DTE"
            if [ "$UTC_HOUR" -ge 15 ]; then EXPIRY="1DTE"; fi

            LAST_CANDLE=$(get_spx_5min_last_candle)
            echo "SPX: $PRICE | SPY: $SPY_PRICE | Candle: $LAST_CANDLE | Trade: $IN_TRADE $DIRECTION"

            if [ "$IN_TRADE" = false ] && [ "$PRICE" != "0" ]; then
              DIST_HIGH=$(echo "scale=2; $ORB_HIGH - $PRICE" | bc)
              DIST_LOW=$(echo "scale=2; $PRICE - $ORB_LOW" | bc)
              if (( $(echo "$DIST_HIGH >= 0 && $DIST_HIGH <= 2" | bc -l) )); then
                send_alert "APPROACHING ORB HIGH" "high" "eyes" \
                  "SPX at $PRICE - $DIST_HIGH pts below ORB High $ORB_HIGH! Get Robinhood ready for CALL!"
              fi
              if (( $(echo "$DIST_LOW >= 0 && $DIST_LOW <= 2" | bc -l) )); then
                send_alert "APPROACHING ORB LOW" "high" "eyes" \
                  "SPX at $PRICE - $DIST_LOW pts above ORB Low $ORB_LOW! Get Robinhood ready for PUT!"
              fi
            fi

            if [ "$IN_TRADE" = false ] && [ "$LAST_CANDLE" != "0" ] && (( $(echo "$LAST_CANDLE > $ORB_HIGH" | bc -l) )); then
              IN_TRADE=true
              DIRECTION="CALL"
              SPY_ENTRY=$SPY_PRICE
              T1=$(echo "scale=2; $SPY_ENTRY + $T1_OFFSET" | bc)
              T2=$(echo "scale=2; $SPY_ENTRY + $T2_OFFSET" | bc)
              send_alert "BULL ENTRY - BUY SPY CALL NOW" "urgent" "rotating_light" \
                "BUY SPY CALL $EXPIRY 0.10 DELTA 50 CONTRACTS NOW! SPX candle closed $LAST_CANDLE above ORB High $ORB_HIGH | SPY entry: \$$SPY_ENTRY | T1: \$$T1 sell 25 | T2: \$$T2 sell 25 | NO AUTO STOP ON ROBINHOOD - EXIT MANUALLY!"
            fi

            if [ "$IN_TRADE" = false ] && [ "$LAST_CANDLE" != "0" ] && (( $(echo "$LAST_CANDLE < $ORB_LOW" | bc -l) )); then
              IN_TRADE=true
              DIRECTION="PUT"
              SPY_ENTRY=$SPY_PRICE
              T1=$(echo "scale=2; $SPY_ENTRY - $T1_OFFSET" | bc)
              T2=$(echo "scale=2; $SPY_ENTRY - $T2_OFFSET" | bc)
              send_alert "BEAR ENTRY - BUY SPY PUT NOW" "urgent" "rotating_light" \
                "BUY SPY PUT $EXPIRY 0.10 DELTA 50 CONTRACTS NOW! SPX candle closed $LAST_CANDLE below ORB Low $ORB_LOW | SPY entry: \$$SPY_ENTRY | T1: \$$T1 sell 25 | T2: \$$T2 sell 25 | NO AUTO STOP ON ROBINHOOD - EXIT MANUALLY!"
            fi

            if [ "$IN_TRADE" = true ] && [ "$DIRECTION" = "CALL" ] && [ "$LAST_CANDLE" != "0" ] && (( $(echo "$LAST_CANDLE < $ORB_HIGH" | bc -l) )); then
              IN_TRADE=false; T1_HIT=false; T2_HIT=false
              send_alert "STOP HIT - EXIT CALL NOW" "urgent" "stop_sign" \
                "SPX candle closed back inside ORB! SELL ALL 50 SPY CALLS NOW on Robinhood! SPX at $PRICE"
            fi

            if [ "$IN_TRADE" = true ] && [ "$DIRECTION" = "PUT" ] && [ "$LAST_CANDLE" != "0" ] && (( $(echo "$LAST_CANDLE > $ORB_LOW" | bc -l) )); then
              IN_TRADE=false; T1_HIT=false; T2_HIT=false
              send_alert "STOP HIT - EXIT PUT NOW" "urgent" "stop_sign" \
                "SPX candle closed back inside ORB! SELL ALL 50 SPY PUTS NOW on Robinhood! SPX at $PRICE"
            fi

            if [ "$IN_TRADE" = true ] && [ "$T1_HIT" = false ]; then
              if ([ "$DIRECTION" = "CALL" ] && (( $(echo "$SPY_PRICE >= $T1" | bc -l) ))) || \
                 ([ "$DIRECTION" = "PUT" ] && (( $(echo "$SPY_PRICE <= $T1" | bc -l) ))); then
                T1_HIT=true
                send_alert "TARGET 1 HIT - SELL 25 NOW" "urgent" "trophy" \
                  "T1 at \$$T1 REACHED! SELL 25 CONTRACTS NOW on Robinhood! Hold 25 for T2 at \$$T2"
              fi
            fi

            if [ "$IN_TRADE" = true ] && [ "$T1_HIT" = true ] && [ "$T2_HIT" = false ]; then
              if ([ "$DIRECTION" = "CALL" ] && (( $(echo "$SPY_PRICE >= $T2" | bc -l) ))) || \
                 ([ "$DIRECTION" = "PUT" ] && (( $(echo "$SPY_PRICE <= $T2" | bc -l) ))); then
                T2_HIT=true; IN_TRADE=false
                send_alert "TARGET 2 HIT - EXIT ALL" "urgent" "trophy" \
                  "T2 at \$$T2 REACHED! SELL REMAINING 25 CONTRACTS NOW! Trade complete!"
              fi
            fi

            if [ $((NOW - LAST_HOURLY)) -ge 3600 ]; then
              LAST_HOURLY=$NOW
              WATCHLIST=$(get_watchlist)
              if [ "$IN_TRADE" = true ]; then
                STATUS="IN $DIRECTION | Entry: \$$SPY_ENTRY | T1: \$$T1 | T2: \$$T2"
              else
                STATUS="Watching ORB: $ORB_LOW - $ORB_HIGH"
              fi
              send_alert "SPX Hourly Update" "default" "chart_with_upwards_trend" \
                "SPX: $PRICE | SPY: \$$SPY_PRICE | $STATUS | $WATCHLIST"
            fi

            sleep 60
          done

          FINAL=$(get_spx)
          send_alert "Session Closed" "default" "white_check_mark" \
            "ORB monitoring done for today. SPX final: $FINAL. See you tomorrow at 9:25 AM!"
